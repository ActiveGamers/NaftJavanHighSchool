server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25m;

    # -----------------------------------------------------------------------
    # gzip
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # nginx gzips text/html by default; the extra types are listed here.
    # (Listing a type that nginx already enables by default raises a
    # "duplicate MIME type" warning, so text/html is not repeated.)
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Laravel front controller
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # PHP - handled by the php-fpm app container
    # -----------------------------------------------------------------------
    # Only the front controller is executable. public/storage maps to the
    # public media disk, which the app and nginx containers share: a file that
    # ends up there must never be interpreted as PHP.
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        # Resolve the app container at request time. A static fastcgi_pass keeps the
        # IP of the previous container and answers 502 after a recreate.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $app_upstream app:9000;

        fastcgi_pass $app_upstream;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # $http_host keeps the port; $host would drop it and break every
        # absolute URL Laravel generates (asset(), route(), canonical).
        fastcgi_param HTTP_HOST $http_host;

        # The app container only ever sees the address of this nginx container
        # in REMOTE_ADDR. The real client address is handed over in the
        # forwarded headers below; $remote_addr REPLACES a client supplied
        # X-Forwarded-For, so the rate limiters of the two forms count every
        # visitor in its own bucket and cannot be fooled with a spoofed
        # header.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;

        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other .php request is not a route of this site: answer 404 instead of
    # handing the file to PHP-FPM.
    location ~ \.php$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Hidden files (except .well-known) are not reachable
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
